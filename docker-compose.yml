services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ai_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: .
    env_file:
      - .env.example
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: brandguard_ai
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  ai_mongodata:

